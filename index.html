    <!-- Bug real (varredura geral, 2026-09-19): este bloco tinha 7
         perguntas com respostas desatualizadas (preço antigo, perfil
         público por padrão, Comunidade liberada a partir de 16) — o
         scripts/prerender.mjs nunca toca em application/ld+json, então
         ficava permanentemente fora de sincronia com o conteúdo real da
         página. Reescrito pra ser exatamente as 5 perguntas/respostas
         visíveis em src/content.js (faq) — mesma fonte, mesmo texto. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Preciso pagar pra usar?",
          "acceptedAnswer": { "@type": "Answer", "text": "Não. O plano grátis já dá pra ler a Bíblia inteira em qualquer ritmo, fazer a oração e a reflexão guiadas, ouvir com a voz do aparelho e acompanhar seu progresso. Sem anúncios em nenhum plano." }
        },
        {
          "@type": "Question",
          "name": "Funciona sem internet?",
          "acceptedAnswer": { "@type": "Answer", "text": "Sim. Leitura, áudio baixado e notas funcionam offline; só o assistente fica indisponível — e o app diz isso na hora, não depois de esperar." }
        },
        {
          "@type": "Question",
          "name": "Qual versão da Bíblia o app usa?",
          "acceptedAnswer": { "@type": "Answer", "text": "NVT em português e NLT em inglês, licenciadas via API.Bible. Trocar de versão não mexe no seu progresso. Mais versões em breve." }
        },
        {
          "@type": "Question",
          "name": "Meus amigos veem meu progresso?",
          "acceptedAnswer": { "@type": "Answer", "text": "Por padrão seu perfil é privado — só nome, foto e mensagem ficam visíveis pros seus amigos. Você pode deixá-lo público a qualquer momento, pra eles verem seu progresso também." }
        },
        {
          "@type": "Question",
          "name": "Tem restrição de idade?",
          "acceptedAnswer": { "@type": "Answer", "text": "Sim, o app é destinado a maiores de 18 anos — você confirma isso ao criar a conta." }
        }
      ]
    }
    </script>
